<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Putaway Pitches</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: white;
            color: black;
            font-family: "Times New Roman", Times, serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: bold;
        }

        h2 {
            margin: 8px 0 20px 0;
            font-size: 22px;
            font-weight: normal;
        }

        .updated {
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* ==============================
           HANDEDNESS FILTERS
           ============================== */

        .handedness-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .handedness-tab {
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
            background: white;
            color: black;
            border: 1px solid #999999;
            padding: 7px 14px;
            cursor: pointer;
        }

        .handedness-tab:hover {
            background: #eeeeee;
        }

        .handedness-tab.active {
            background: black;
            color: white;
            border-color: black;
        }


        /* ==============================
           PITCH TYPE TABS
           ============================== */

        .pitch-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 25px;
            border-bottom: 2px solid black;
            padding-bottom: 8px;
        }

        .pitch-tab {
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
            background: white;
            color: black;
            border: 1px solid #999999;
            padding: 7px 12px;
            cursor: pointer;
        }

        .pitch-tab:hover {
            background: #eeeeee;
        }

        .pitch-tab.active {
            background: black;
            color: white;
            border-color: black;
        }


        /* ==============================
           TABLE
           ============================== */

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
        }

        th {
            text-align: center;
            border-bottom: 2px solid black;
            padding: 8px 6px;
        }

        td {
            text-align: center;
            padding: 7px 6px;
            border-bottom: 1px solid #cccccc;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }


        /* ==============================
           ERROR
           ============================== */

        .error {
            margin-top: 30px;
            font-size: 18px;
        }


        /* ==============================
           MOBILE
           ============================== */

        @media (max-width: 600px) {

            body {
                padding: 25px 10px;
            }

            h1 {
                font-size: 26px;
            }

            h2 {
                font-size: 20px;
            }

            .handedness-tab,
            .pitch-tab {
                font-size: 14px;
                padding: 6px 9px;
            }

            table {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PUTAWAY PITCHES</h1>

    <h2 id="pitchTitle">Four-Seam Fastball</h2>

    <div class="updated" id="updated"></div>


    <!-- ==============================
         HANDEDNESS FILTERS
         ============================== -->

    <div class="handedness-tabs" id="handednessTabs">

        <button
            class="handedness-tab active"
            data-split="overall">
            Overall
        </button>

        <button
            class="handedness-tab"
            data-split="vs_rhb">
            vs RHB
        </button>

        <button
            class="handedness-tab"
            data-split="vs_lhb">
            vs LHB
        </button>

    </div>


    <!-- ==============================
         PITCH TYPE TABS
         ============================== -->

    <div class="pitch-tabs" id="pitchTabs"></div>


    <!-- ==============================
         LEADERBOARD
         ============================== -->

    <table>

        <thead>

            <tr>

                <th>Player</th>

                <th id="pitchColumn">
                    2-Str FF
                </th>

                <th>K</th>

                <th>Putaway Rate</th>

            </tr>

        </thead>

        <tbody id="leaderboard"></tbody>

    </table>


    <div class="error" id="error"></div>

</div>


<script>

let leaderboardData = {};

let currentSplit = "overall";

let currentPitchType = "ff";


// ==========================================
// PITCH TYPE ORDER
// ==========================================

const pitchOrder = [
    "ff",
    "si",
    "fc",
    "sl",
    "st",
    "ch",
    "fs",
    "cu",
    "kc",
    "sv",
    "cs",
    "fa",
    "fo",
    "kn",
    "sc",
    "ep",
    "po",
    "un"
];


// ==========================================
// LOAD DATA
// ==========================================

async function loadLeaderboard() {

    try {

        const response =
            await fetch("putaway_pitches.json");

        if (!response.ok) {

            throw new Error(
                "Could not load leaderboard data."
            );

        }

        const data =
            await response.json();

        leaderboardData =
            data.pitch_types;


        // Set up handedness buttons

        setupHandednessTabs();


        // Build pitch tabs for Overall

        createPitchTabs();


        // Find first available pitch type

        const firstPitch =
            getFirstQualifiedPitchType(
                currentSplit
            );


        if (firstPitch) {

            currentPitchType =
                firstPitch;

            showPitchType(
                currentPitchType
            );

        }


        // Updated timestamp

        const updated =
            new Date(
                data.last_updated
            );


        document.getElementById(
            "updated"
        ).textContent =

            "Updated " +

            updated.toLocaleString(
                "en-US",
                {
                    month: "short",
                    day: "numeric",
                    year: "numeric",
                    hour: "numeric",
                    minute: "2-digit"
                }
            );


    } catch (error) {

        document.getElementById(
            "error"
        ).textContent =
            "Unable to load leaderboard data.";

        console.error(error);

    }

}


// ==========================================
// HANDEDNESS TABS
// ==========================================

function setupHandednessTabs() {

    const buttons =
        document.querySelectorAll(
            ".handedness-tab"
        );


    buttons.forEach(button => {

        button.addEventListener(
            "click",
            function() {

                const split =
                    button.dataset.split;


                currentSplit =
                    split;


                buttons.forEach(
                    otherButton => {

                        otherButton.classList.toggle(
                            "active",
                            otherButton === button
                        );

                    }
                );


                // Rebuild pitch tabs because
                // qualification can differ
                // between Overall/RHB/LHB.

                createPitchTabs();


                // Keep the current pitch if
                // it has qualified pitchers.
                // Otherwise select the first
                // available pitch.

                const currentPitch =
                    leaderboardData[
                        currentPitchType
                    ];


                if (
                    currentPitch &&
                    currentPitch[
                        currentSplit
                    ] &&
                    currentPitch[
                        currentSplit
                    ].length > 0
                ) {

                    showPitchType(
                        currentPitchType
                    );

                } else {

                    const firstPitch =
                        getFirstQualifiedPitchType(
                            currentSplit
                        );


                    if (firstPitch) {

                        currentPitchType =
                            firstPitch;

                        showPitchType(
                            firstPitch
                        );

                    } else {

                        clearLeaderboard();

                    }

                }

            }
        );

    });

}


// ==========================================
// GET FIRST QUALIFIED PITCH TYPE
// ==========================================

function getFirstQualifiedPitchType(
    split
) {

    const availableTypes =
        Object.keys(
            leaderboardData
        );


    const orderedTypes =
        pitchOrder.filter(
            type =>
                availableTypes.includes(type)
        );


    // Add any unexpected pitch types
    // after our preferred order.

    availableTypes.forEach(
        type => {

            if (
                !orderedTypes.includes(type)
            ) {

                orderedTypes.push(type);

            }

        }
    );


    return orderedTypes.find(
        type => {

            const pitch =
                leaderboardData[type];

            return (
                pitch &&
                pitch[split] &&
                pitch[split].length > 0
            );

        }
    ) || null;

}


// ==========================================
// CREATE PITCH TABS
// ==========================================

function createPitchTabs() {

    const tabs =
        document.getElementById(
            "pitchTabs"
        );


    tabs.innerHTML = "";


    const availableTypes =
        Object.keys(
            leaderboardData
        );


    const orderedTypes =
        pitchOrder.filter(
            type =>
                availableTypes.includes(type)
        );


    availableTypes.forEach(
        type => {

            if (
                !orderedTypes.includes(type)
            ) {

                orderedTypes.push(type);

            }

        }
    );


    orderedTypes.forEach(
        type => {

            const pitch =
                leaderboardData[type];


            // Only show the pitch tab if
            // there is at least one
            // qualified pitcher for the
            // currently selected split.

            if (
                !pitch ||
                !pitch[currentSplit] ||
                pitch[currentSplit].length === 0
            ) {

                return;

            }


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "pitch-tab";


            button.textContent =
                pitch.name;


            button.dataset.pitchType =
                type;


            button.onclick =
                function() {

                    currentPitchType =
                        type;

                    showPitchType(type);

                };


            tabs.appendChild(
                button
            );

        }
    );

}


// ==========================================
// SHOW PITCH TYPE
// ==========================================

function showPitchType(type) {

    const pitch =
        leaderboardData[type];


    if (!pitch) {

        return;

    }


    const players =
        pitch[currentSplit];


    if (!players) {

        return;

    }


    currentPitchType =
        type;


    // Update title

    document.getElementById(
        "pitchTitle"
    ).textContent =
        pitch.name;


    // Update pitch-count column

    document.getElementById(
        "pitchColumn"
    ).textContent =
        "2-Str " +
        pitch.statcast_code;


    // Update active pitch tab

    document
        .querySelectorAll(
            ".pitch-tab"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.pitchType === type
            );

        });


    // Clear table

    const table =
        document.getElementById(
            "leaderboard"
        );


    table.innerHTML = "";


    // Build rows

    players.forEach(
        player => {

            const row =
                document.createElement(
                    "tr"
                );


            const playerCell =
                document.createElement(
                    "td"
                );


            const pitchesCell =
                document.createElement(
                    "td"
                );


            const strikeoutsCell =
                document.createElement(
                    "td"
                );


            const rateCell =
                document.createElement(
                    "td"
                );


            // Convert:
            //
            // Misiorowski, Jacob
            //
            // to:
            //
            // Jacob Misiorowski, MIL

            const nameParts =
                player.player_name.split(
                    ", "
                );


            const displayName =
                nameParts.length === 2
                    ? nameParts[1] +
                      " " +
                      nameParts[0]
                    : player.player_name;


            playerCell.textContent =
                displayName +
                ", " +
                player.teams.join("/");


            pitchesCell.textContent =
                player.two_strike_pitches;


            strikeoutsCell.textContent =
                player.strikeouts;


            rateCell.textContent =
                (
                    player.putaway_rate *
                    100
                ).toFixed(1) + "%";


            row.appendChild(
                playerCell
            );


            row.appendChild(
                pitchesCell
            );


            row.appendChild(
                strikeoutsCell
            );


            row.appendChild(
                rateCell
            );


            table.appendChild(
                row
            );

        }
    );

}


// ==========================================
// CLEAR LEADERBOARD
// ==========================================

function clearLeaderboard() {

    document.getElementById(
        "leaderboard"
    ).innerHTML = "";

    document.getElementById(
        "pitchTitle"
    ).textContent = "";

    document.getElementById(
        "pitchColumn"
    ).textContent = "";

}


// ==========================================
// START
// ==========================================

loadLeaderboard();

</script>

</body>
</html>
